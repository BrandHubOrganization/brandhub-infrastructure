services:
  nginx:
    image: nginx:stable-alpine
    container_name: brandhub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/certs
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - brandhub-network

networks:
  brandhub-network:
    name: brandhub-network
    driver: bridge
