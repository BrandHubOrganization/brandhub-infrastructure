# PostgreSQL. Init SQL runs only with an empty data directory.

services:
  postgres:
    image: postgres:17-alpine
    container_name: brandhub-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:?POSTGRES_HOST_PORT is required}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../../docs/database/init-postgres-v2.sql:/docker-entrypoint-initdb.d/init-postgres-v2.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - brandhub-network

volumes:
  postgres_data:
    name: brandhub-postgres-v2-data

networks:
  brandhub-network:
    name: brandhub-network
    driver: bridge
