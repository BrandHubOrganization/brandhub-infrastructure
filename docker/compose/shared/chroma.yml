services:
  chromadb:
    # Keep in sync with brandhub-ai-service/requirements.txt (chromadb-client).
    image: chromadb/chroma:1.5.9
    container_name: brandhub-chromadb
    ports:
      - "${CHROMADB_HOST_PORT:?CHROMADB_HOST_PORT is required}:8000"
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8000
          printf 'GET /api/v2/heartbeat HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r -t 4 health_status <&3
          [[ "$$health_status" == *" 200 "* ]]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - brandhub-network
    restart: unless-stopped


volumes:
  chroma-data:
    name: brandhub-chroma-data

networks:
  brandhub-network:
    name: brandhub-network
    driver: bridge
