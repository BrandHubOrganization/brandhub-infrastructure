services:
  monitoring:
    build:
      context: ../../../../brandhub-monitoring
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MONITORING_CONFIG: /run/monitoring/config.json
      MONITORING_SECRETS: /run/secrets/monitoring.json
      MONITORING_ALLOW_LOCAL_HTTP: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ../../../../brandhub-monitoring/config.json
        target: /run/monitoring/config.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../../../brandhub-monitoring/secrets.json
        target: /run/secrets/monitoring.json
        read_only: true
        bind:
          create_host_path: false
    networks:
      - brandhub-network

networks:
  brandhub-network:
    name: brandhub-network
    driver: bridge
