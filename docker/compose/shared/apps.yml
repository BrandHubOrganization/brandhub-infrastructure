services:
  api-gateway:
    build:
      context: ../../../../brandhub-api-gateway
      dockerfile: Dockerfile
    container_name: brandhub-api-gateway
    ports:
      - "${API_GATEWAY_HOST_PORT:?API_GATEWAY_HOST_PORT is required}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      BUSINESS_SERVICE_URL: http://business-service:8081
      AI_SERVICE_URL: http://ai-service:8082
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:?RATE_LIMIT_PER_MINUTE is required}
      RATE_LIMIT_TTL_SECONDS: ${RATE_LIMIT_TTL_SECONDS:?RATE_LIMIT_TTL_SECONDS is required}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:?RATE_LIMIT_FAIL_OPEN is required}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:?AUTH_RATE_LIMIT_PER_MINUTE is required}
      AI_TEXT_RATE_LIMIT_PER_MINUTE: ${AI_TEXT_RATE_LIMIT_PER_MINUTE:?AI_TEXT_RATE_LIMIT_PER_MINUTE is required}
      AI_IMAGE_RATE_LIMIT_PER_MINUTE: ${AI_IMAGE_RATE_LIMIT_PER_MINUTE:?AI_IMAGE_RATE_LIMIT_PER_MINUTE is required}
      AI_VIDEO_RATE_LIMIT_PER_MINUTE: ${AI_VIDEO_RATE_LIMIT_PER_MINUTE:?AI_VIDEO_RATE_LIMIT_PER_MINUTE is required}
      PUBLISH_RATE_LIMIT_PER_MINUTE: ${PUBLISH_RATE_LIMIT_PER_MINUTE:?PUBLISH_RATE_LIMIT_PER_MINUTE is required}
    depends_on:
      redis:
        condition: service_healthy
      business-service:
        condition: service_started
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - brandhub-network
    restart: unless-stopped

  business-service:
    build:
      context: ../../../../brandhub-business-service
      dockerfile: Dockerfile
    container_name: brandhub-business-service
    ports:
      - "${BUSINESS_SERVICE_HOST_PORT:?BUSINESS_SERVICE_HOST_PORT is required}:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE is required}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      MONGODB_DATABASE: ${MONGODB_DATABASE:?MONGODB_DATABASE is required}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:?JWT_ACCESS_EXPIRATION_MS is required}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:?JWT_REFRESH_EXPIRATION_MS is required}
      AES_SECRET_KEY: ${AES_SECRET_KEY:?AES_SECRET_KEY is required}
      AI_SERVICE_URL: http://ai-service:8082
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY is required}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET is required}
      AWS_S3_REGION: ${AWS_S3_REGION:?AWS_S3_REGION is required}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:?FACEBOOK_APP_ID is required}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:?FACEBOOK_APP_SECRET is required}
      FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI:?FACEBOOK_REDIRECT_URI is required}
      INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI:?INSTAGRAM_REDIRECT_URI is required}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:?TIKTOK_CLIENT_KEY is required}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:?TIKTOK_CLIENT_SECRET is required}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:?TIKTOK_REDIRECT_URI is required}
      THREADS_REDIRECT_URI: ${THREADS_REDIRECT_URI:?THREADS_REDIRECT_URI is required}
      ZALO_APP_ID: ${ZALO_APP_ID:?ZALO_APP_ID is required}
      ZALO_APP_SECRET: ${ZALO_APP_SECRET:?ZALO_APP_SECRET is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      PASSWORD_RESET_TTL_SECONDS: ${PASSWORD_RESET_TTL_SECONDS:?PASSWORD_RESET_TTL_SECONDS is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - brandhub-network
    restart: unless-stopped

  ai-service:
    build:
      context: ../../../../brandhub-ai-service
      dockerfile: Dockerfile
    container_name: brandhub-ai-service
    ports:
      - "${AI_SERVICE_HOST_PORT:?AI_SERVICE_HOST_PORT is required}:8082"
    environment:
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
    depends_on:
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - brandhub-network
    restart: unless-stopped

  publisher-service:
    build:
      context: ../../../../brandhub-publisher-service
      dockerfile: Dockerfile
    container_name: brandhub-publisher-service
    ports:
      - "${PUBLISHER_SERVICE_HOST_PORT:?PUBLISHER_SERVICE_HOST_PORT is required}:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      BUSINESS_SERVICE_URL: http://business-service:8081
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY is required}
      PUBLISH_INTERVAL_MS: ${PUBLISH_INTERVAL_MS:?PUBLISH_INTERVAL_MS is required}
      MAX_RETRY_ATTEMPTS: ${MAX_RETRY_ATTEMPTS:?MAX_RETRY_ATTEMPTS is required}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - brandhub-network
    restart: unless-stopped


networks:
  brandhub-network:
    name: brandhub-network
    driver: bridge
