# Cache and broker: Redis and RabbitMQ.

services:
  redis:
    image: redis:7.2-alpine
    container_name: brandhub-redis
    ports:
      - "${REDIS_HOST_PORT:?REDIS_HOST_PORT is required}:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:?REDIS_MAXMEMORY is required}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:?REDIS_MAXMEMORY_POLICY is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brandhub-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: brandhub-rabbitmq
    ports:
      - "${RABBITMQ_AMQP_HOST_PORT:?RABBITMQ_AMQP_HOST_PORT is required}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:?RABBITMQ_MANAGEMENT_HOST_PORT is required}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - brandhub-network
    restart: unless-stopped

volumes:
  redis-data:
    name: brandhub-redis-data
  rabbitmq-data:
    name: brandhub-rabbitmq-data

networks:
  brandhub-network:
    name: brandhub-network
    driver: bridge
