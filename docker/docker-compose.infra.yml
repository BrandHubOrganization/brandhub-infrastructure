  #   environment:
  #     RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-brandhub}
  #     RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-password}
  #   volumes:
  #     - rabbitmq-data:/var/lib/rabbitmq
  #   healthcheck:
  #     test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 20s
  #   networks:
  #     - brandhub-network
  #   restart: unless-stopped

  # Vector database for AI/RAG features.
  # TODO: pin a concrete ChromaDB image version when the team confirms compatibility.
  # chromadb:
  #   image: chromadb/chroma:latest
  #   container_name: brandhub-chromadb
  #   volumes:
  #     - chroma-data:/chroma/chroma
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/v1/heartbeat || exit 1"]
