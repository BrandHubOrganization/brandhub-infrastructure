# Development tools only — no service overrides here.
# Host ports now live in each infra group file (databases / ai-data / cache-broker),
# so each group is self-contained and can be run selectively.
#
# Run with the infra groups:
#   docker compose -f docker-compose.infra.databases.yml \
#                  -f docker-compose.infra.ai-data.yml \
#                  -f docker-compose.infra.cache-broker.yml \
#                  -f docker-compose.dev.yml up -d

services:
  # Web UI for PostgreSQL. Requires a running postgres service (databases group).
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: brandhub-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - brandhub-network

  # Web UI for Redis. Requires a running redis service (cache-broker group).
  redisinsight:
    image: redis/redisinsight:3.8.0
    container_name: brandhub-redisinsight
    restart: unless-stopped
    ports:
      - "${REDISINSIGHT_HOST_PORT:-5540}:5540"
    volumes:
      - redisinsight_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5540/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - brandhub-network

volumes:
  pgadmin_data:
    name: brandhub-pgadmin-data
  redisinsight_data:
    name: brandhub-redisinsight-data

networks:
  brandhub-network:
    name: brandhub-network
    driver: bridge
