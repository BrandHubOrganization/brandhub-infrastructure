services:
  api-gateway:
    build:
      context: ../../brandhub-api-gateway
      dockerfile: Dockerfile
    container_name: brandhub-api-gateway
    ports:
      - "${API_GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      BUSINESS_SERVICE_URL: http://business-service:8081
      AI_SERVICE_URL: http://ai-service:8082
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
      RATE_LIMIT_TTL_SECONDS: ${RATE_LIMIT_TTL_SECONDS:-60}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-true}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-5}
      AI_TEXT_RATE_LIMIT_PER_MINUTE: ${AI_TEXT_RATE_LIMIT_PER_MINUTE:-20}
      AI_IMAGE_RATE_LIMIT_PER_MINUTE: ${AI_IMAGE_RATE_LIMIT_PER_MINUTE:-5}
      AI_VIDEO_RATE_LIMIT_PER_MINUTE: ${AI_VIDEO_RATE_LIMIT_PER_MINUTE:-2}
      PUBLISH_RATE_LIMIT_PER_MINUTE: ${PUBLISH_RATE_LIMIT_PER_MINUTE:-10}
    depends_on:
      redis:
        condition: service_healthy
      business-service:
        condition: service_started
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - brandhub-network
    restart: unless-stopped

  business-service:
    build:
      context: ../../brandhub-business-service
      dockerfile: Dockerfile
    container_name: brandhub-business-service
    ports:
      - "${BUSINESS_SERVICE_HOST_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-brandhub}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-brandhub}
      POSTGRES_USERNAME: ${POSTGRES_USER:-brandhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-brandhub}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-2592000000}
      AES_SECRET_KEY: ${AES_SECRET_KEY}
      AI_SERVICE_URL: http://ai-service:8082
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-brandhub-media}
      AWS_S3_REGION: ${AWS_S3_REGION:-ap-southeast-1}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI:-http://localhost:8080/api/v1/social-accounts/callback/facebook}
      INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI:-http://localhost:8080/api/v1/social-accounts/callback/instagram}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-http://localhost:8080/api/v1/social-accounts/callback/tiktok}
      THREADS_REDIRECT_URI: ${THREADS_REDIRECT_URI:-http://localhost:8080/api/v1/social-accounts/callback/threads}
      ZALO_APP_ID: ${ZALO_APP_ID:-}
      ZALO_APP_SECRET: ${ZALO_APP_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - brandhub-network
    restart: unless-stopped

  ai-service:
    build:
      context: ../../brandhub-ai-service
      dockerfile: Dockerfile
    container_name: brandhub-ai-service
    ports:
      - "${AI_SERVICE_HOST_PORT:-8082}:8082"
    environment:
      APP_PORT: 8082
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      STABILITY_AI_API_KEY: ${STABILITY_AI_API_KEY:-}
      GOOGLE_VEO_API_KEY: ${GOOGLE_VEO_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-brandhub-media}
      AWS_S3_REGION: ${AWS_S3_REGION:-ap-southeast-1}
      RAG_TOP_K: ${RAG_TOP_K:-5}
    depends_on:
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - brandhub-network
    restart: unless-stopped

  publisher-service:
    build:
      context: ../../brandhub-publisher-service
      dockerfile: Dockerfile
    container_name: brandhub-publisher-service
    ports:
      - "${PUBLISHER_SERVICE_HOST_PORT:-8083}:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-brandhub}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      BUSINESS_SERVICE_URL: http://business-service:8081
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      PUBLISH_INTERVAL_MS: ${PUBLISH_INTERVAL_MS:-5000}
      MAX_RETRY_ATTEMPTS: ${MAX_RETRY_ATTEMPTS:-3}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - brandhub-network
    restart: unless-stopped

  web-dashboard:
    build:
      context: ../../brandhub-web-dashboard
      dockerfile: Dockerfile
    container_name: brandhub-web-dashboard
    ports:
      - "${WEB_DASHBOARD_HOST_PORT:-3000}:80"
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - brandhub-network
    restart: unless-stopped

networks:
  brandhub-network:
    name: brandhub-network
    driver: bridge



