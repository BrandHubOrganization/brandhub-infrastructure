services:
  api-gateway:
    build:
      context: ../../brandhub-api-gateway
      dockerfile: Dockerfile
    container_name: brandhub-api-gateway
    ports:
      - "${API_GATEWAY_HOST_PORT}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BUSINESS_SERVICE_URL: http://business-service:8081
      AI_SERVICE_URL: http://ai-service:8082
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE}
      RATE_LIMIT_TTL_SECONDS: ${RATE_LIMIT_TTL_SECONDS}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE}
      AI_TEXT_RATE_LIMIT_PER_MINUTE: ${AI_TEXT_RATE_LIMIT_PER_MINUTE}
      AI_IMAGE_RATE_LIMIT_PER_MINUTE: ${AI_IMAGE_RATE_LIMIT_PER_MINUTE}
      AI_VIDEO_RATE_LIMIT_PER_MINUTE: ${AI_VIDEO_RATE_LIMIT_PER_MINUTE}
      PUBLISH_RATE_LIMIT_PER_MINUTE: ${PUBLISH_RATE_LIMIT_PER_MINUTE}
    depends_on:
      redis:
        condition: service_healthy
      business-service:
        condition: service_started
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - brandhub-network
    restart: unless-stopped

  business-service:
    build:
      context: ../../brandhub-business-service
      dockerfile: Dockerfile
    container_name: brandhub-business-service
    ports:
      - "${BUSINESS_SERVICE_HOST_PORT}:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USERNAME: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS}
      AES_SECRET_KEY: ${AES_SECRET_KEY}
      AI_SERVICE_URL: http://ai-service:8082
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_REGION: ${AWS_S3_REGION}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI}
      INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI}
      THREADS_REDIRECT_URI: ${THREADS_REDIRECT_URI}
      ZALO_APP_ID: ${ZALO_APP_ID}
      ZALO_APP_SECRET: ${ZALO_APP_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      MAIL_FROM: ${MAIL_FROM}
      PASSWORD_RESET_TTL_SECONDS: ${PASSWORD_RESET_TTL_SECONDS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - brandhub-network
    restart: unless-stopped

  ai-service:
    build:
      context: ../../brandhub-ai-service
      dockerfile: Dockerfile
    container_name: brandhub-ai-service
    ports:
      - "${AI_SERVICE_HOST_PORT}:8082"
    environment:
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
    depends_on:
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - brandhub-network
    restart: unless-stopped

  publisher-service:
    build:
      context: ../../brandhub-publisher-service
      dockerfile: Dockerfile
    container_name: brandhub-publisher-service
    ports:
      - "${PUBLISHER_SERVICE_HOST_PORT}:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      BUSINESS_SERVICE_URL: http://business-service:8081
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      PUBLISH_INTERVAL_MS: ${PUBLISH_INTERVAL_MS}
      MAX_RETRY_ATTEMPTS: ${MAX_RETRY_ATTEMPTS}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - brandhub-network
    restart: unless-stopped

  web-dashboard:
    build:
      context: ../../brandhub-web-dashboard
      dockerfile: Dockerfile
    container_name: brandhub-web-dashboard
    ports:
      - "${WEB_DASHBOARD_HOST_PORT}:80"
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - brandhub-network
    restart: unless-stopped

networks:
  brandhub-network:
    name: brandhub-network
    driver: bridge



