# AI data: ChromaDB and Neo4j.

services:
  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: brandhub-chromadb
    ports:
      - "${CHROMADB_HOST_PORT}:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - brandhub-network
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    container_name: brandhub-neo4j
    ports:
      - "${NEO4J_HOST_PORT_HTTP}:7474"
      - "${NEO4J_HOST_PORT_BOLT}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?NEO4J_AUTH is required}
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - brandhub-network
    restart: unless-stopped

volumes:
  chroma-data:
    name: brandhub-chroma-data
  neo4j-data:
    name: brandhub-neo4j-data
  neo4j-logs:
    name: brandhub-neo4j-logs

networks:
  brandhub-network:
    name: brandhub-network
    driver: bridge
