title = "BrandHub secret scanning"

[extend]
useDefault = true

[[rules]]
id = "mongodb-embedded-password"
description = "MongoDB URI with embedded credentials"
regex = '''mongodb(?:\+srv)?://[^\s:/"\x27]+:([^\s@"\x27]+)@[^\s/"\x27]+'''
secretGroup = 1
[[rules.allowlists]]
description = "Documented synthetic local credentials only"
regexTarget = "secret"
regexes = ['''^(?:password|pass|test|testpass|user|postgres|brandhub|changeme|your_password|\$\{[^}]+\})$''']

[[allowlists]]
description = "Reviewed documentation example, not a live credential"
condition = "AND"
paths = ['''(?:^|/)docs/feature/repository/remove\-material\-repository/spec\.md$''']
regexTarget = "match"
regexes = ['''^media\.s3_key\ ==\ material\.s3_key`[\r\n]*$''']

[[allowlists]]
description = "Reviewed documentation example, not a live credential"
condition = "AND"
paths = ['''(?:^|/)docs/feature/repository/remove\-material\-repository/spec\.md$''']
regexTarget = "match"
regexes = ['''^media\.s3_key":\ material\.s3_key\ [\r\n]*$''']

[[allowlists]]
description = "Reviewed documentation example, not a live credential"
condition = "AND"
paths = ['''(?:^|/)docs/feature/system\-health\-mongodb\-refactor/test\.md$''']
regexTarget = "match"
regexes = ['''^mongodb\+srv://<test_user>:<test_password>@<cluster>\.mongodb\.net[\r\n]*$''']

