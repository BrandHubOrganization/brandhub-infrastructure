map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
 listen 80;
 server_name api.brandhub.id.vn;
 location /.well-known/acme-challenge/ { root /var/www/certbot; }
 location / { return 308 https://$host$request_uri; }
}
server {
 listen 443 ssl;
 server_name api.brandhub.id.vn;
 server_tokens off;
 ssl_certificate /etc/letsencrypt/live/api.brandhub.id.vn/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/api.brandhub.id.vn/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 205m;
 add_header X-Content-Type-Options "nosniff" always;
 add_header X-Frame-Options "DENY" always;
 add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 location / {
  proxy_pass http://api-gateway:8080;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 1260s;
  proxy_request_buffering off;
  proxy_buffering off;
 }
 # Edit_Video API on brandhub-edit-video (private 8095). It checks X-API-Key itself.
 # /edit-video/v1/edits -> http://172.31.20.80:8095/v1/edits
 location /edit-video/ {
  client_max_body_size 1024m;
  proxy_pass http://172.31.20.80:8095/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  proxy_request_buffering off;
  proxy_buffering off;
  # Edit_Video sleeps when idle (stopped EC2): the connect fails fast and the waker starts it.
  proxy_connect_timeout 3s;
  proxy_intercept_errors on;
  error_page 502 504 = @wake_edit_video;
 }
 location @wake_edit_video {
  # Resolved per request, so Nginx still starts if the waker container is missing.
  resolver 127.0.0.11 valid=30s;
  set $waker http://waker:8099;
  proxy_pass $waker/wake/edit-video;
  proxy_method GET;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
 }
}
