# On the core EC2 (172.31.24.149:8084): AI on dedicated brandhub-ai (172.31.20.60) calls
# CRAWLER_API_URL=http://172.31.24.149:8084 instead of calling the sleeping crawl host directly.
# Crawl running  -> proxied to 172.31.20.50:8084.
# Crawl stopped  -> connect fails fast -> waker starts it and returns 503 STARTING + Retry-After.
server {
  listen 8084;
  client_max_body_size 2m;
  location / {
    proxy_pass http://172.31.20.50:8084;
    proxy_connect_timeout 3s;
    proxy_read_timeout 600s;
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 502 504 = @wake;
  }
  location @wake {
    resolver 127.0.0.11 valid=30s;
    set $waker http://waker:8099;
    proxy_pass $waker/wake/crawl;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }
}
