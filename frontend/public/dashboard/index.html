<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrandHub — Workload Dashboard</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1e2230;
    --border: #2a2f3f;
    --text: #e6e8ef;
    --text-dim: #9298ab;
    --accent: #6ea8fe;
    --done: #3fb950;
    --review: #d29922;
    --progress: #58a6ff;
    --todo: #4b5163;
    --crit: #f85149;
    --high: #d29922;
    --med: #3fb950;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6fa;
      --panel: #ffffff;
      --panel-2: #f0f1f6;
      --border: #dde1ea;
      --text: #1a1d29;
      --text-dim: #6b7280;
      --accent: #2563eb;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 20px; }
  .status-bar {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 20px;
    font-size: 0.82rem; color: var(--text-dim);
  }
  .status-bar b { color: var(--text); }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; }
  .badge-ok { background: rgba(63,185,80,.15); color: var(--done); }
  .badge-warn { background: rgba(210,153,34,.15); color: var(--review); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px;
  }
  .card h2 { font-size: 0.95rem; margin: 0 0 14px; display: flex; justify-content: space-between; align-items: center; }
  .card h2 .count { color: var(--text-dim); font-weight: 400; font-size: 0.8rem; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; }
  .bar-row:hover .bar-name { color: var(--accent); }
  .bar-name { width: 90px; flex-shrink: 0; font-size: 0.82rem; }
  .bar-track { flex: 1; height: 22px; background: var(--panel-2); border-radius: 6px; overflow: hidden; display: flex; }
  .bar-seg { height: 100%; transition: width .3s; }
  .bar-total { width: 34px; text-align: right; font-size: 0.8rem; color: var(--text-dim); flex-shrink: 0; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 0.75rem; color: var(--text-dim); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 500; }
  .pill { padding: 1px 7px; border-radius: 999px; font-size: 0.68rem; font-weight: 600; white-space: nowrap; }
  .pill-crit { background: rgba(248,81,73,.15); color: var(--crit); }
  .pill-high { background: rgba(210,153,34,.15); color: var(--high); }
  .pill-med { background: rgba(63,185,80,.15); color: var(--med); }
  .pill-done { background: rgba(63,185,80,.15); color: var(--done); }
  .pill-review { background: rgba(210,153,34,.15); color: var(--review); }
  .pill-progress { background: rgba(88,166,255,.15); color: var(--progress); }
  .pill-todo { background: rgba(75,81,99,.3); color: var(--text-dim); }
  #detail { display: none; }
  #detail.open { display: block; }
  .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .close-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 0.8rem; }
  .close-btn:hover { border-color: var(--accent); }
  .filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .filters select, .filters input {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 8px; font-size: 0.78rem;
  }
  a.task-link { color: var(--accent); text-decoration: none; }
  a.task-link:hover { text-decoration: underline; }
  .empty-state { color: var(--text-dim); font-size: 0.85rem; padding: 20px; text-align: center; }
</style>
</head>
<body>

<h1>📊 BrandHub — Workload Dashboard</h1>
<div class="subtitle">Tự động đọc <code>BrandHub_Master_Plan.md</code> (kế hoạch) + <code>jira_status.json</code> (tiến độ thật, nếu có). Không hardcode.</div>

<div class="status-bar" id="statusBar">Đang tải dữ liệu…</div>

<div class="grid">
  <div class="card">
    <h2>Khối lượng theo người <span class="count" id="totalCount"></span></h2>
    <div id="memberChart"></div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="card">
    <h2>Theo Epic (top 12) <span class="count" id="epicCount"></span></h2>
    <div id="epicChart"></div>
  </div>
</div>

<div class="card" id="detail">
  <div class="detail-header">
    <h2 id="detailTitle" style="margin:0"></h2>
    <button class="close-btn" onclick="closeDetail()">✕ Đóng</button>
  </div>
  <div class="filters">
    <select id="filterStatus"><option value="">Tất cả status</option></select>
    <select id="filterPriority"><option value="">Tất cả priority</option></select>
    <input id="filterSearch" placeholder="Tìm task ID / mô tả…">
  </div>
  <table id="detailTable">
    <thead><tr><th>Task ID</th><th>Epic</th><th>Description</th><th>Priority</th><th>Status</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script src="dashboard.js"></script>
</body>
</html>
